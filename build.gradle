plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.MooBoo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Spring WebFlux 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// FIXME 맥OS 이슈, 개발환경 및 운영환경에서 제거해야 함
	runtimeOnly "io.netty:netty-resolver-dns-native-macos:4.1.109.Final:osx-aarch_64"

	// 로컬 환경 h2 데이터베이스
	runtimeOnly 'com.h2database:h2'

	// 개발 환경 mysql 데이터베이스
	implementation group: 'com.mysql', name: 'mysql-connector-j', version: '9.1.0'

	// SQL 모니터링 라이브러리
	// FIXME 운영 환경에서 제거할 것
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

	// Swagger https://springdoc.org/#Introduction
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// OAuth2 Client (구글, 카카오, 네이버 등 로그인 처리)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// JJWT API
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'

	// JWT 서명용 구현체 (HMAC SHA, RSA 등)
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // or jjwt-gson

	// redis 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

tasks.named('test') {
	useJUnitPlatform()
}
